services:
  redis:
    image: redis:7-alpine
    container_name: manus-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - manus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    container_name: manus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manus}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - manus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d manus"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 仅用于构建沙箱镜像(manus-sandbox:latest)。
  # 运行期的沙箱不再由 Compose 常驻，而是由 api 按会话动态创建，
  # 名为 manus-sandbox-<随机8位>，空闲 60 分钟后自毁。
  # 需要单独起一个共享沙箱时：docker compose --profile build up -d sandbox
  sandbox:
    profiles: ["build"]
    build:
      context: ./sandbox
    image: manus-sandbox:latest

  api:
    build:
      context: ./api
    image: manus-api:latest
    container_name: manus-api
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      ENV: ${ENV:-production}
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@manus-postgres:5432/${POSTGRES_DB:-manus}
      REDIS_HOST: manus-redis
      SANDBOX_NETWORK: manus-network
      SANDBOX_IMAGE: manus-sandbox:latest
      SANDBOX_NAME_PREFIX: manus-sandbox
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - manus-network
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://localhost:8000/api/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  ui:
    build:
      context: ./ui
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        INTERNAL_API_BASE_URL: http://api:8000/api
    image: manus-ui:latest
    container_name: manus-ui
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: /api
      INTERNAL_API_BASE_URL: http://api:8000/api
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - manus-network

  nginx:
    image: nginx:1.27-alpine
    container_name: manus-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_started
    networks:
      - manus-network

volumes:
  redis-data:
  postgres-data:

networks:
  manus-network:
    name: manus-network
    driver: bridge
